<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Doyoon (Daniel) Kim's personal website: a small multiplayer 3D world."
    />
    <meta name="theme-color" content="#0d1024" />
    <title>Daniel's World</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Without scripts the world never loads: say so instead of loading forever. By its id, so
         it holds over the stylesheet the build links after it. -->
    <noscript>
      <style>
        #loading {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="app">
      <div id="loading" class="loading" role="status" aria-live="polite">
        <p class="loading-title">Doyoon (Daniel) Kim</p>
        <div class="loading-bar" aria-hidden="true"><div class="loading-bar-fill"></div></div>
        <p class="loading-text">Loading…</p>
      </div>
      <noscript>
        <!-- As the landing says it when the world cannot run: the portfolio is the way in. -->
        <section class="overlay landing" aria-labelledby="noscript-title">
          <div class="landing-main">
            <h1 class="title landing-title" id="noscript-title">Doyoon (Daniel) Kim</h1>
            <span class="bar landing-bar" aria-hidden="true"></span>
            <p class="landing-notice">
              This site is a small 3D world and needs JavaScript. The portfolio has everything in
              it.
            </p>
            <a class="button button-primary button-large landing-portfolio" href="/portfolio.html">
              View the portfolio
            </a>
          </div>
        </section>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
